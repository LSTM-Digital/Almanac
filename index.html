var PAGES = {"Main": {"title": "LSTM Almanac: what it is", "tpl": "<div style=\"min-height: 100%; background: #FFFFFF\">\n\n<header style=\"border-bottom: 1px solid #E4E2DE; background: #FFFFFF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 24px\">\n<a href=\"#Main\" style=\"display: flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; color: #1B1B1F\">\n<span aria-hidden=\"true\" style=\"width: 14px; height: 14px; background: #B4122D; display: block\"><\/span>\n<span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 600; letter-spacing: -0.01em\">LSTM Almanac<\/span>\n<\/a>\n<nav aria-label=\"Sections\">\n<ol style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0 2px\">\n<li><a class=\"nav\" href=\"#Main\" aria-current=\"page\">1 What it is<\/a><\/li>\n<li><a class=\"nav\" href=\"#Information\">2 What it holds<\/a><\/li>\n<li><a class=\"nav\" href=\"#Connections\">3 Connections<\/a><\/li>\n<li><a class=\"nav\" href=\"#Workflow\">4 Workflow<\/a><\/li>\n<li><a class=\"nav\" href=\"#Messaging\">5 Messaging<\/a><\/li>\n<li><a class=\"nav\" href=\"#Accuracy\">6 Accuracy<\/a><\/li>\n<li><a class=\"nav\" href=\"#Roadmap\">7 Roadmap<\/a><\/li>\n<li><a class=\"nav\" href=\"#Briefing-demo\">Future use<\/a><\/li>\n<\/ol>\n<\/nav>\n<\/div>\n<\/header>\n\n<main>\n<section style=\"max-width: 1200px; margin: 0 auto; padding: clamp(48px, 8vw, 104px) clamp(16px, 4vw, 40px) 56px\">\n<p style=\"margin: 0 0 20px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #B4122D\">Section 1 of 7 · What is the Almanac?<\/p>\n<h1 tabindex=\"-1\" style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(56px, 9vw, 112px); line-height: 0.95; letter-spacing: -0.03em\">LSTM Almanac<\/h1>\n<p style=\"margin: 20px 0 0; font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: clamp(22px, 2.6vw, 32px); line-height: 1.25; color: #4A4A50; max-width: 820px\">Trusted knowledge. Consistent messaging. Better institutional communications.<\/p>\n<p style=\"margin: 32px 0 0; font-size: 19px; line-height: 1.6; max-width: 720px; text-wrap: pretty\">The Almanac brings together a small, carefully maintained collection of LSTM's institutional messaging, research strengths, capabilities and key facts, making them easier to find, approve and reuse.<\/p>\n\n<div style=\"margin-top: 40px; padding: 20px 24px; background: #F6F5F3; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px\">\n<p style=\"margin: 0; font-size: 15px; line-height: 1.5; max-width: 560px\"><b>Where it stands:<\/b> the Phase 1 technical foundation is substantially complete. Content is now being drafted, checked and approved. Search and AI features are planned, not yet built.<\/p>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\" aria-label=\"Status key\">\n<span style=\"display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #1B1B1F; color: #FFFFFF; border: 1px solid #1B1B1F\">Built<\/span>\n<span style=\"display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #FBEFF1; color: #7E0C1F; border: 1px solid #B4122D\">In progress<\/span>\n<span style=\"display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #4A4A50; border: 1px dashed #6B6B72\">Planned<\/span>\n<\/div>\n<\/div>\n<p style=\"margin: 14px 0 0; font-size: 14px; color: #6B6B72\">Seven short sections, about five minutes in all. Use the menu to jump around, or follow “Next” at the end of each section.<\/p>\n<\/section>\n\n<section aria-labelledby=\"flow-h\" style=\"border-top: 1px solid #E4E2DE; background: #FBFAF9\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 72px clamp(16px, 4vw, 40px)\">\n<h2 id=\"flow-h\" style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.1; letter-spacing: -0.015em; max-width: 760px\">Intentionally small. The value is in what we choose, check and connect.<\/h2>\n<p style=\"margin: 16px 0 0; font-size: 17px; line-height: 1.6; max-width: 700px; color: #4A4A50\">LSTM already holds a great deal of information in its own systems. The Almanac does not copy those systems. It draws selectively on them to keep a much smaller set of knowledge colleagues need again and again.<\/p>\n\n<ol style=\"list-style: none; margin: 48px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 16px\">\n<li style=\"background: #FFFFFF; border: 1px solid #E4E2DE; padding: 24px; display: flex; flex-direction: column; gap: 16px\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">01 · Many sources<\/span>\n<div aria-hidden=\"true\" style=\"display: grid; grid-template-columns: repeat(12, 8px); gap: 5px\">\n<sc-for list=\"{{ many }}\" as=\"d\" hint-placeholder-count=\"48\"><span style=\"width: 8px; height: 8px; background: #C9C6C0; display: block\"><\/span><\/sc-for>\n<\/div>\n<h3 style=\"margin: 0; font-size: 18px; line-height: 1.3\">Many information sources<\/h3>\n<ul style=\"margin: 0; padding: 0 0 0 18px; font-size: 14px; line-height: 1.7; color: #4A4A50\">\n<li>The public website<\/li>\n<li>The Current Research Information System (CRIS)<\/li>\n<li>SharePoint and the intranet<\/li>\n<li>Annual reports and institutional documents<\/li>\n<li>Specialist systems run by individual teams<\/li>\n<\/ul>\n<\/li>\n<li style=\"background: #FFFFFF; border: 1px solid #E4E2DE; padding: 24px; display: flex; flex-direction: column; gap: 16px\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">02 · Curated<\/span>\n<div aria-hidden=\"true\" style=\"display: grid; grid-template-columns: repeat(12, 8px); gap: 5px\">\n<sc-for list=\"{{ curated }}\" as=\"d\" hint-placeholder-count=\"12\"><span style=\"width: 8px; height: 8px; border: 1.5px dashed #1B1B1F; box-sizing: border-box; display: block\"><\/span><\/sc-for>\n<\/div>\n<h3 style=\"margin: 0; font-size: 18px; line-height: 1.3\">Carefully curated knowledge<\/h3>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #4A4A50\">Only information with a clear, repeated use is drafted as a record, from an authoritative source, with an owner. Everything starts as a draft.<\/p>\n<\/li>\n<li style=\"background: #FFFFFF; border: 1px solid #E4E2DE; padding: 24px; display: flex; flex-direction: column; gap: 16px\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">03 · Approved<\/span>\n<div aria-hidden=\"true\" style=\"display: grid; grid-template-columns: repeat(12, 8px); gap: 5px\">\n<sc-for list=\"{{ approved }}\" as=\"d\" hint-placeholder-count=\"6\"><span style=\"width: 8px; height: 8px; background: #B4122D; display: block\"><\/span><\/sc-for>\n<\/div>\n<h3 style=\"margin: 0; font-size: 18px; line-height: 1.3\">Approved institutional content<\/h3>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #4A4A50\">An editor checks each record and an authorised approver signs it off. Approved records keep their source, owner and review date.<\/p>\n<\/li>\n<li style=\"background: #1B1B1F; color: #FFFFFF; border: 1px solid #1B1B1F; padding: 24px; display: flex; flex-direction: column; gap: 16px\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #C9C6C0\">04 · Reused<\/span>\n<div aria-hidden=\"true\" style=\"display: flex; gap: 8px\">\n<span style=\"width: 22px; height: 28px; border: 1.5px solid #FFFFFF; box-sizing: border-box; display: block\"><\/span>\n<span style=\"width: 22px; height: 28px; border: 1.5px solid #FFFFFF; box-sizing: border-box; display: block\"><\/span>\n<span style=\"width: 22px; height: 28px; border: 1.5px dashed #C9C6C0; box-sizing: border-box; display: block\"><\/span>\n<\/div>\n<h3 style=\"margin: 0; font-size: 18px; line-height: 1.3\">Reusable outputs<\/h3>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #E4E2DE\">Approved wording and facts colleagues can copy as they stand today; search, briefings and slide decks later.<\/p>\n<\/li>\n<\/ol>\n<p style=\"margin: 20px 0 0; font-size: 14px; color: #6B6B72\">Squares are illustrative of scale, not record counts.<\/p>\n<\/div>\n<\/section>\n\n<section aria-labelledby=\"principles-h\" style=\"border-top: 1px solid #E4E2DE\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 72px clamp(16px, 4vw, 40px)\">\n<h2 id=\"principles-h\" style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.1; letter-spacing: -0.015em\">Three principles<\/h2>\n<div style=\"margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 40px 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; border-top: 3px solid #B4122D; padding-top: 20px\">\n<h3 style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 30px; line-height: 1.1\">Curated, <span style=\"color: #6B6B72\">not comprehensive<\/span><\/h3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6\">Only institutional information that has a clear purpose is included.<\/p>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 12px; border-top: 3px solid #B4122D; padding-top: 20px\">\n<h3 style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 30px; line-height: 1.1\">Approved, <span style=\"color: #6B6B72\">not assumed<\/span><\/h3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6\">Content is supported by evidence and reviewed before being made available as approved knowledge.<\/p>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 12px; border-top: 3px solid #B4122D; padding-top: 20px\">\n<h3 style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 30px; line-height: 1.1\">Connected, <span style=\"color: #6B6B72\">not duplicated<\/span><\/h3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6\">The Almanac links related areas of LSTM without replicating existing institutional systems.<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<section aria-labelledby=\"isnt-h\" style=\"border-top: 1px solid #E4E2DE; background: #FBFAF9\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 72px clamp(16px, 4vw, 40px) 88px\">\n<h2 id=\"isnt-h\" style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.1; letter-spacing: -0.015em\">What it is, and what it isn't<\/h2>\n<p style=\"margin: 16px 0 0; font-size: 17px; line-height: 1.6; max-width: 700px; color: #4A4A50\">Select anything in the right-hand list to see where that information lives instead.<\/p>\n<div style=\"margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 32px\">\n\n<div style=\"background: #FFFFFF; border: 1px solid #E4E2DE; padding: 28px\">\n<h3 style=\"margin: 0 0 20px; font-size: 13px; font-family: 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.06em; text-transform: uppercase; color: #1B1B1F\">What it is<\/h3>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px\">\n<li style=\"display: flex; align-items: center; gap: 14px; min-height: 48px; font-size: 18px; border-bottom: 1px solid #EFEDEA\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" style=\"flex: none; fill: none; stroke: #B4122D; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round\"><path d=\"M4 10.5 L8.2 14.5 L16 6\"><\/path><\/svg>A messaging resource<\/li>\n<li style=\"display: flex; align-items: center; gap: 14px; min-height: 48px; font-size: 18px; border-bottom: 1px solid #EFEDEA\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" style=\"flex: none; fill: none; stroke: #B4122D; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round\"><path d=\"M4 10.5 L8.2 14.5 L16 6\"><\/path><\/svg>A source of verified institutional facts<\/li>\n<li style=\"display: flex; align-items: center; gap: 14px; min-height: 48px; font-size: 18px; border-bottom: 1px solid #EFEDEA\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" style=\"flex: none; fill: none; stroke: #B4122D; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round\"><path d=\"M4 10.5 L8.2 14.5 L16 6\"><\/path><\/svg>A map of research strengths and capabilities<\/li>\n<li style=\"display: flex; align-items: center; gap: 14px; min-height: 48px; font-size: 18px; border-bottom: 1px solid #EFEDEA\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" style=\"flex: none; fill: none; stroke: #B4122D; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round\"><path d=\"M4 10.5 L8.2 14.5 L16 6\"><\/path><\/svg>A governed content library<\/li>\n<li style=\"display: flex; align-items: center; gap: 14px; min-height: 48px; font-size: 18px\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" style=\"flex: none; fill: none; stroke: #B4122D; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round\"><path d=\"M4 10.5 L8.2 14.5 L16 6\"><\/path><\/svg>A foundation for responsible AI use<\/li>\n<\/ul>\n<\/div>\n\n<div style=\"background: #FFFFFF; border: 1px solid #E4E2DE; padding: 28px; display: flex; flex-direction: column; gap: 20px\">\n<h3 style=\"margin: 0; font-size: 13px; font-family: 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.06em; text-transform: uppercase; color: #1B1B1F\">What it isn't<\/h3>\n<div role=\"group\" aria-label=\"What the Almanac isn't\" style=\"display: flex; flex-direction: column; gap: 8px\">\n<sc-for list=\"{{ nots }}\" as=\"n\" hint-placeholder-count=\"5\">\n<button class=\"opt\" type=\"button\" onClick=\"{{ n.pick }}\" aria-pressed=\"{{ n.pressed }}\" style=\"display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 16px; text-align: left; font-size: 17px; border: 1px solid {{ n.bd }}; background: {{ n.bg }}; color: {{ n.fg }}\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" style=\"flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round\"><path d=\"M4 4 L14 14 M14 4 L4 14\"><\/path><\/svg><span>{{ n.label }}<\/span><\/button>\n<\/sc-for>\n<\/div>\n<div class=\"fade\" aria-live=\"polite\" style=\"border-top: 3px solid #1B1B1F; padding-top: 16px\">\n<p style=\"margin: 0 0 6px; font-size: 13px; font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #6B6B72\">Instead<\/p>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.55\">{{ current.instead }}<\/p>\n<\/div>\n<\/div>\n\n<\/div>\n<\/div>\n<\/section>\n\n<nav aria-label=\"Next section\" style=\"border-top: 1px solid #E4E2DE\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 32px clamp(16px, 4vw, 40px) 56px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 16px\">\n<a href=\"#Information\" style=\"display: inline-flex; flex-direction: column; gap: 4px; min-height: 44px; padding: 16px 24px; background: #1B1B1F; color: #FFFFFF; text-decoration: none\"><span style=\"font-size: 13px; color: #C9C6C0\">Next · Section 2<\/span><span style=\"font-size: 19px; font-weight: 600\">What information does it hold? →<\/span><\/a>\n<\/div>\n<\/nav>\n<\/main>\n<\/div>"}, "Information": {"title": "LSTM Almanac: what it holds", "tpl": "<div style=\"min-height: 100%; background: #FFFFFF\">\n\n<header style=\"border-bottom: 1px solid #E4E2DE; background: #FFFFFF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 24px\">\n<a href=\"#Main\" style=\"display: flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; color: #1B1B1F\">\n<span aria-hidden=\"true\" style=\"width: 14px; height: 14px; background: #B4122D; display: block\"><\/span>\n<span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 600; letter-spacing: -0.01em\">LSTM Almanac<\/span>\n<\/a>\n<nav aria-label=\"Sections\">\n<ol style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0 2px\">\n<li><a class=\"nav\" href=\"#Main\">1 What it is<\/a><\/li>\n<li><a class=\"nav\" href=\"#Information\" aria-current=\"page\">2 What it holds<\/a><\/li>\n<li><a class=\"nav\" href=\"#Connections\">3 Connections<\/a><\/li>\n<li><a class=\"nav\" href=\"#Workflow\">4 Workflow<\/a><\/li>\n<li><a class=\"nav\" href=\"#Messaging\">5 Messaging<\/a><\/li>\n<li><a class=\"nav\" href=\"#Accuracy\">6 Accuracy<\/a><\/li>\n<li><a class=\"nav\" href=\"#Roadmap\">7 Roadmap<\/a><\/li>\n<li><a class=\"nav\" href=\"#Briefing-demo\">Future use<\/a><\/li>\n<\/ol>\n<\/nav>\n<\/div>\n<\/header>\n\n<main>\n<section style=\"max-width: 1200px; margin: 0 auto; padding: clamp(48px, 7vw, 88px) clamp(16px, 4vw, 40px) 40px\">\n<p style=\"margin: 0 0 20px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #B4122D\">Section 2 of 7 · What information does it hold?<\/p>\n<h1 tabindex=\"-1\" style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(40px, 5.6vw, 68px); line-height: 1.02; letter-spacing: -0.02em; max-width: 900px\">Six kinds of knowledge, each with a clear job<\/h1>\n<p style=\"margin: 24px 0 0; font-size: 18px; line-height: 1.6; max-width: 720px; color: #4A4A50; text-wrap: pretty\">Every record has a type, an owner, a source and a review date. Select a dataset to see what it contains, why it exists, an example record and how it is kept up to date.<\/p>\n<\/section>\n\n<section aria-label=\"Datasets\" style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px)\">\n<div role=\"group\" aria-label=\"Choose a dataset\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 12px\">\n<sc-for list=\"{{ cards }}\" as=\"c\" hint-placeholder-count=\"6\">\n<button class=\"opt\" type=\"button\" onClick=\"{{ c.pick }}\" aria-pressed=\"{{ c.pressed }}\" style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-height: 148px; padding: 18px; text-align: left; border: 1px solid {{ c.bd }}; background: {{ c.bg }}; color: {{ c.fg }}\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; opacity: 0.75\">{{ c.n }}<\/span>\n<span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 500; line-height: 1.15\">{{ c.title }}<\/span>\n<span style=\"font-size: 13px; line-height: 1.45; opacity: 0.85\">{{ c.blurb }}<\/span>\n<\/button>\n<\/sc-for>\n<\/div>\n<\/section>\n\n<section aria-live=\"polite\" aria-label=\"Selected dataset\" style=\"max-width: 1200px; margin: 0 auto; padding: 32px clamp(16px, 4vw, 40px) 72px\">\n<div class=\"fade\" style=\"border: 1px solid #1B1B1F; background: #FFFFFF\">\n<div style=\"padding: 28px clamp(20px, 3vw, 36px); border-bottom: 1px solid #E4E2DE; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px\">\n<h2 style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(28px, 3.2vw, 38px); line-heig  0 8px; font-size: 13px; font-family: 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.06em; text-transform: uppercase; color: #B4122D\">How it is maintained<\/h3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6\">{{ cur.maintained }}<\/p>\n<\/div>\n<\/div>\n<\/div>\n\n<aside aria-label=\"Example record\" style=\"flex: 1 1 340px; min-width: 0; background: #F6F5F3; padding: 28px clamp(20px, 3vw, 32px); display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px\">\n<h3 style=\"margin: 0; font-size: 13px; font-family: 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.06em; text-transform: uppercase; color: #1B1B1F\">Example record<\/h3>\n<span style=\"display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{ cur.rec.chipBg }}; color: {{ cur.rec.chipFg }}; border: 1px dashed {{ cur.rec.chipBd }}\">{{ cur.rec.chip }}<\/span>\n<\/div>\n<div style=\"background: #FFFFFF; border: 1.5px dashed #6B6B72; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 21px; line-height: 1.2\">{{ cur.rec.title }}<\/p>\n<dl style=\"margin: 0; display: flex; flex-direction: column; gap: 8px\">\n<sc-for list=\"{{ cur.rec.fields }}\" as=\"f\" hint-placeholder-count=\"5\">\n<div style=\"display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; padding-top: 8px; border-top: 1px solid #EFEDEA\">\n<dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72; padding-top: 2px\">{{ f.k }}<\/dt>\n<dd style=\"margin: 0; font-size: 14px; line-height: 1.5\">{{ f.v }}<\/dd>\n<\/div>\n<\/sc-for>\n<\/dl>\n<\/div>\n<p style=\"margin: 0; font-size: 13px; line-height: 1.55; color: #4A4A50\">{{ cur.rec.note }}<\/p>\n<\/aside>\n<\/div>\n<\/div>\n\n<p style=\"margin: 20p ght: 1.7\">\n<li>Units that merely share a theme, tag or place<\/li>\n<li>Navigation, “related” or team blocks on a web page<\/li>\n<li>The Centre for Evidence Synthesis in Global Health, which is no longer on the theme page or in the directory<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<blockquote style=\"margin: 48px 0 0; padding: 0; font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: clamp(22px, 2.4vw, 28px); line-height: 1.35; max-width: 860px; color: #1B1B1F\">The Almanac doesn't store every project or publication. It captures the institutional relationships and verified knowledge colleagues most often need.<\/blockquote>\n<\/section>\n\n<nav aria-label=\"Previous and next sections\" style=\"border-top: 1px solid #E4E2DE; margin-top: 48px\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 32px clamp(16px, 4vw, 40px) 56px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px\">\n<a href=\"#Information\" style=\"display: inline-flex; flex-direction: column; gap: 4px; min-height: 44px; padding: 16px 24px; border: 1px solid #1B1B1F; color: #1B1B1F; text-decoration: none\"><span style=\"font-size: 13px; color: #6B6B72\">Previous · Section 2<\/span><span style=\"font-size: 19px; font-weight: 600\">← What information does it hold?<\/span><\/a>\n<a href=\"#Workflow\" style=\"display: inline-flex; flex-direction: column; gap: 4px; min-height: 44px; padding: 16px 24px; background: #1B1B1F; color: #FFFFFF; text-decoration: none\"><span style=\"font-size: 13px; color: #C9C6C0\">Next · Section 4<\/span><span style=\"font-size: 19px; font-weight: 600\">The content workflow →<\/span><\/a>\n<\/div>\n<\/nav>\n<\/main>\n<\/div>"}, "Workflow": {"title": "LSTM Almanac: the content workflow", "tpl": "<div style=\"min-height: 100%; background: #FFFFFF\">\n\n<header style=\"border-bottom: 1px solid #E4E2DE; background: #FFFFFF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 24px\">\n<a href=\"#Main\" style=\"display: flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; color: #1B1B1F\">\n<span aria-hidden=\"true\" style=\"width: 14px; height: 14px; background: #B4122D; display: block\"><\/span>\n<span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 600; letter-spacing: -0.01em\">LSTM Almanac<\/span>\n<\/a>\n<nav aria-label=\"Sections\">\n<ol style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0 2px\">\n<li><a class=\"nav\" href=\"#Main\">1 What it is<\/a><\/li>\n<li><a class=\"nav\" href=\"#Information\">2 What it holds<\/a><\/li>\n<li><a class=\"nav\" href=\"#Connections\">3 Connections<\/a><\/li>\n<li><a class=\"nav\" href=\"#Workflow\" aria-current=\"page\">4 Workflow<\/a><\/li>\n<li><a class=\"nav\" href=\"#Messaging\">5 Messaging<\/a><\/li>\n<li><a class=\"nav\" href=\"#Accuracy\">6 Accuracy<\/a><\/li>\n<li><a class=\"nav\" href=\"#Roadmap\">7 Roadmap<\/a><\/li>\n<li><a class=\"nav\" href=\"#Briefing-demo\">Future use<\/a><\/li>\n<\/ol>\n<\/nav>\n<\/div>\n<\/header>\n\n<main>\n<section style=\"max-width: 1200px; margin: 0 auto; padding: clamp(48px, 7vw, 88px) clamp(16px, 4vw, 40px) 32px\">\n<p style=\"margin: 0 0 20px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #B4122D\">Section 4 of 7 · The content workflow<\/p>\n<h1 tabindex=\"-1\" style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(40px, 5.6vw, 68px); line-height: 1.02; letter-spacing: -0.02em; max-width: 900px\">From source to approved knowledge, in seven steps<\/h1>\n<div style=\"margin-top: 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 16px 20px; border: 1.5px dashed #6B6B72; max-width: 820px\">\n<span style=\"display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #FFFFFF; color: #4A4A50; border: 1px dashed #6B6B72\">Draft<\/span>\n<p style=\"margin: 0; flex: 1 1 300px; font-size: 16px; line-height: 1.5\"><b>All imported content begins as a draft.<\/b> Nothing in a content pack is approved until an authorised approver signs it off.<\/p>\n<\/div>\n<\/section>\n\n<section aria-label=\"Workflow stages\" style=\"max-width: 1200px; margin: 0 auto; padding: 16px clamp(16px, 4vw, 40px) 0\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<div style=\"flex: 3 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n<p style=\"margin: 0; padding: 8px 12px; font-size: 13px; font-weight: 600; border: 1.5px dashed #6B6B72; color: #1B1B1F\">Content preparation <span style=\"font-weight: 400; color: #4A4A50\">· External Relations<\/span><\/p>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(120px, 100%), 1fr)); gap: 8px\">\n<sc-for list=\"{{ prep }}\" as=\"st\" hint-placeholder-count=\"3\">\n<button class=\"opt\" type=\"button\" onClick=\"{{ st.pick }}\" aria-pressed=\"{{ st.on }}\" aria-label=\"Step {{ st.n }}: {{ st.name }}\" style=\"min-height: 112px; padding: 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 10px; text-align: left; border: 1.5px solid {{ st.bd }}; background: {{ st.bg }}; color: {{ st.fg }}\"><span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 22px; line-height: 1\">{{ st.n }}<\/span><span style=\"font-size: 15px; font-weight: 600; line-height: 1.25\">{{ st.name }}<\/span><\/button>\n<\/sc-for>\n<\/div>\n<\/div>\n<div style=\"flex: 1 1 140px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n<p style=\"margin: 0; padding: 8px 12px; font-size: 13px; font-weight: 600; border: 1.5px solid #6B6B72; color: #1B1B1F\">Editorial review <span style=\"font-weight: 400; color: #4A4A50\">· Editor<\/span><\/p>\n<div style=\"display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px\">\n<sc-for list=\"{{ review }}\" as=\"st\" hint-placeholder-count=\"1\">\n<button class=\"opt\" type=\"button\" onClick=\"{{ st.pick }}\" aria-pressed=\"{{ st.on }}\" aria-label=\"Step {{ st.n }}: {{ st.name }}\" style=\"min-height: 112px; padding: 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 10px; text-align: left; border: 1.5px solid {{ st.bd }}; background: {{ st.bg }}; color: {{ st.fg }}\"><span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 22px; line-height: 1\">{{ st.n }}<\/span><span style=\"font-size: 15px; font-weight: 600; line-height: 1.25\">{{ st.name }}<\/span><\/button>\n<\/sc-for>\n<\/div>\n<\/div>\n<div style=\"flex: 1 1 140px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n<p style=\"margin: 0; padding: 8px 12px; font-size: 13px; font-weight: 600; background: #FBEFF1; border: 1.5px solid #B4122D; color: #7E0C1F\">Institutional approval <span style=\"font-weight: 400\">· Approver<\/span><\/p>\n<div style=\"display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px\">\n<sc-for list=\"{{ approve }}\" as=\"st\" hint-placeholder-count=\"1\">\n<button class=\"opt\" type=\"button\" onClick=\"{{ st.pick }}\" aria-pressed=\"{{ st.on }}\" aria-label=\"Step {{ st.n }}: {{ st.name }}\" style=\"min-height: 112px; padding: 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 10px; text-align: left; border: 1.5px solid {{ st.bd }}; background: {{ st.bg }}; color: {{ st.fg }}\"><span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 22px; line-height: 1\">{{ st.n }}<\/span><span style=\"font-size: 15px; font-weight: 600; line-height: 1.25\">{{ st.name }}<\/span><\/button>\n<\/sc-for>\n<\/div>\n<\/div>\n<div style=\"flex: 2 1 280px; min-width: 0; display: flex; flex-direct rder-top: 3px solid #1B1B1F; padding-top: 20px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px\">\n<h2 style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(30px, 3.4vw, 40px); line-height: 1.1\">{{ cur.n }}. {{ cur.name }}<\/h2>\n<p style=\"margin: 0; font-size: 14px\"><span style=\"color: #6B6B72\">Responsible:<\/span> <b>{{ cur.role }}<\/b><\/p>\n<\/div>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; max-width: 680px\">{{ cur.what }}<\/p>\n<sc-if value=\"{{ cur.hasList }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<p style=\"margin: 0 0 8px; font-size: 13px; font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #6B6B72\">{{ cur.listTitle }}<\/p>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px\">\n<sc-for list=\"{{ cur.list }}\" as=\"li\" hint-placeholder-count=\"3\"><li style=\"padding: 6px 12px; font-size: 14px; background: #F6F5F3; border: 1px solid #E4E2DE\">{{ li.t }}<\/li><\/sc-for>\n<\/ul>\n<\/div>\n<\/sc-if>\n<div style=\"padding: 16px 18px; background: #F6F5F3\">\n<p style=\"margin: 0 0 4px; font-size: 13px; font-weight: 700\">If it isn't right<\/p>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.55\">{{ cur.ifNot }}<\/p>\n<\/div>\n<\/div>\n\n<aside aria-label=\"Example record\" style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"border: 1.5px {{ rec.border }} {{ rec.bd }}; background: #FFFFFF; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">Example record moving through<\/p>\n<p style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 22px; line-height: 1.2\">Research theme description<\/p>\n<span class=\"opt\" style=\"align-self: flex-start; display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: {{ rec.chipBg }}; color: {{ rec.chipFg }}; border: 1px {{ rec.border }} {{ rec.bd }}\">{{ rec.status }}<\/span>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: #4A4A50\">{{ rec.note }}<\/p>\n<sc-if value=\"{{ returned }}\" hint-placeholder-val=\"{{ false }}\">\n<p class=\"fade\" style=\"margin: 0; padding: 10px 12px; font-size: 14px; line-height: 1.5; background: #FFF3D6; color: #4A2E00; border: 1px solid #B07A12\"><b>Returned with comments.<\/b> Back with the preparer as a draft. Nothing has been published.<\/p>\n<\/sc-if>\n<\/div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<button type=\"button\" onClick=\"{{ back }}\" disabled=\"{{ atStart }}\" style=\"min-height: 44px; padding: 0 16px; font-size: 15px; font-weight: 600; background: #FFFFFF; color: #1B1B1F; border: 1.5px solid #1B1B1F\">← Back<\/button>\n<button type=\"button\" onClick=\"{{ next }}\" disabled=\"{{ atEnd }}\" style=\"min-height: 44px; padding: 0 16px; font-size: 15px; font-weight: 600; background: #1B1B1F; color: #FFFFFF; border: 1.5px solid #1B1B1F\">{{ nextLabel }}<\/button>\n<sc-if value=\"{{ canReturn }}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" onClick=\"{{ sendBack }}\" style=\"min-height: 44px; padding: 0 16px; font-size: 15px; font-weight: 600; background: #FFF3D6; color: #4A2E00; border: 1.5px solid #B07A12\">Request changes<\/button>\n<\/sc-if>\n<\/div>\n<\/aside>\n\n<\/div>\n<\/section>\n\n<nav aria-label=\"Previous and next sections\" style=\"border-top: 1px solid #E4E2DE\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 32px clamp(16px, 4vw, 40px) 56px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px\">\n<a href=\"#Connections\" style=\"display: inline-flex; flex-direction: column; gap: 4px; min-height: 44px; padding: 16px 24px; border: 1px solid #1B1B1F; color: #1B1B1F; text-decoration: none\"><span style=\"font-size: 13px; color: #6B6B72\">Previous · Section 3<\/span><span style=\"font-size: 19px; font-weight: 600\">← How knowledge is connected<\/span><\/a>\n<a href=\"#Messaging\" style=\"display: inline-flex; flex-direction: column; gap: 4px; min-height: 44px; padding: 16px 24px; background: #1B1B1F; color: #FFFFFF; text-decoration: none\"><span style=\"font-size: 13px; color: #C9C6C0\">Next · Section 5<\/span><span style=\"font-size: 19px; font-weight: 600\">How messaging is managed →<\/span><\/a>\n<\/div>\n<\/nav>\n<\/main>\n<\/div>"}, "Messaging": {"title": "LSTM Almanac: how messaging is managed", "tpl": "<div style=\"min-height: 100%; background: #FFFFFF\">\n\n<header style=\"border-bottom: 1px solid #E4E2DE; background: #FFFFFF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 24px\">\n<a href=\"#Main\" style=\"display: flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; color: #1B1B1F\">\n<span aria-hidden=\"true\" style=\"width: 14px; height: 14px; background: #B4122D; display: block\"><\/span>\n<span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 600; letter-spacing: -0.01em\">LSTM Almanac<\/span>\n<\/a>\n<nav aria-label=\"Sections\">\n<ol style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0 2px\">\n<li><a class=\"nav\" href=\"#Main\">1 What it is<\/a><\/li>\n<li><a class=\"nav\" href=\"#Information\">2 What it holds<\/a><\/li>\n<li><a class=\"nav\" href=\"#Connections\">3 Connections<\/a><\/li>\n<li><a class=\"nav\" href=\"#Workflow\">4 Workflow<\/a><\/li>\n<li><a class=\"nav\" href=\"#Messaging\" aria-current=\"page\">5 Messaging<\/a><\/li>\n<li><a class=\"nav\" href=\"#Accuracy\">6 Accuracy<\/a><\/li>\n<li><a class=\"nav\" href=\"#Roadmap\">7 Roadmap<\/a><\/li>\n<li><a class=\"nav\" href=\"#Briefing-demo\">Future use<\/a><\/li>\n<\/ol>\n<\/nav>\n<\/div>\n<\/header>\n\n<main>\n<section style=\"max-width: 1200px; margin: 0 auto; padding: clamp(48px, 7vw, 88px) clamp(16px, 4vw, 40px) 32px\">\n<p style=\"margin: 0 0 20px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #B4122D\">Section 5 of 7 · How messaging is managed<\/p>\n<h1 tabindex=\"-1\" style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(40px, 5.6vw, 68px); line-height: 1.02; letter-spacing: -0.02em; max-width: 900px\">Take as much detail as you need<\/h1>\n<p style=\"margin: 24px 0 0; font-size: 18px; line-height: 1.6; max-width: 720px; color: #4A4A50; text-wrap: pretty\">Each messaging subject can hold approved wording at three lengths. Colleagues pick the one that fits and use it word for word.<\/p>\n<\/section>\n\n<section aria-labelledby=\"len-h\" style=\"max-width: 1200px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 40px) 64px\">\n<div style=\"border: 1px solid #1B1B1F\">\n<div style=\"padding: 20px clamp(18px, 3vw, 28px); border-bottom: 1px solid #E4E2DE; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n<div>\n<p style=\"margin: 0 0 4px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">Messaging subject · research<\/p>\n<h2 id=\"len-h\" style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 30px; line-height: 1.1\">Research and innovation<\/h2>\n<\/div>\n<div role=\"tablist\" aria-label=\"Length\" style=\"display: flex; gap: 0; border: 1.5px solid #1B1B1F\">\n<sc-for list=\"{{ lens }}\" as=\"l\" hint-placeholder-count=\"3\">\n<button class=\"opt\" type=\"button\" role=\"tab\" aria-selected=\"{{ l.on }}\" onClick=\"{{ l.pick }}\" style=\"min-height: 44px; min-width: 96px; padding: 0 16px; font-size: 15px; font-weight: 600; border: 0; background: {{ l.bg }}; color: {{ l.fg }}\">{{ l.name }}<\/button>\n<\/sc-for>\n<\/div>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap\">\n<div role=\"tabpanel\" aria-label=\"{{ len.name }} wording\" style=\"flex: 999 1 520px; min-width: 0; padding: 28px clamp(18px, 3vw, 28px); display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px\">\n<p style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 26px\">{{ len.name }}<\/p>\n<p style=\"margin: 0; font-size: 15px; color: #4A4A50\">{{ len.size }}<\/p>\n<\/div>\n<p style=\"margin: 0; padding: 10px 14px; font-size: 14px; line-height: 1.5; background: #FFF3D6; color: #4A2E00; border: 1px dashed #B07A12\"><b>Illustrative placeholder.<\/b> No approved wording has been supplied. In the Almanac, the approved text appears here exactly as colleagues should use it.<\/p>\n<div aria-hidden=\"true\" style=\"display: flex; flex-direction: column; gap: 9px; padding: 4px 0\">\n<sc-for list=\"{{ len.lines }}\" as=\"ln\" hint-placeholder-count=\"3\"><span class=\"bar\" style=\"display: block; height: 10px; background: #D9D6D0; width: {{ ln.w }}\"><\/span><\/sc-for>\n<\/div>\n<p style=\"margin: 0; font-size: 14px; color: #4A4A50\"><b style=\"color: #1B1B1F\">Suggested uses:<\/b> {{ len.uses }}<\/p>\n<\/div>\n<aside aria-label=\"Wording details\" style=\"flex: 1 1 280px; min-width: 0; background: #F6F5F3; padding: 28px clamp(18px, 3vw, 28px)\">\n<dl style=\"margin: 0; display: flex; flex-direction: column\">\n<div style=\"display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid #E4E2DE\"><dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">length<\/dt><dd style=\"margin: 0; font-size: 14px\">{{ len.key }}<\/dd><\/div>\n<div style=\"display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid #E4E2DE\"><dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">purpose<\/dt><dd style=\"margin: 0; font-size: 14px\">general<\/dd><\/div>\n<div style=\"display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid #E4E2DE\"><dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">owner<\/dt><dd style=\"margin: 0; font-size: 14px\">External Relations<\/dd><\/div>\n<div style=\"display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid #E4E2DE\"><dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">approval<\/dt><dd style=\"margin: 0; font-size: 14px\">Each length approved on its own<\/dd><\/div>\n<div style=\"display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid #E4E2DE\"><dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">external use<\/dt><dd style=\"margin: 0; font-size: 14px\">Separate decision by the owner<\/dd><\/div>\n<div style=\"display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 12px; padding: 10px 0\"><dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">facts quoted<\/dt><dd style=\"margin: 0; font-size: 14px\">Listed, so the wording is flagged if a figure changes<\/dd><\/div>\n<\/dl>\n<\/aside>\n<\/div>\n<\/div>\n<\/section>\n\n<section aria-labelledby=\"purpose-h\" style=\"border-top: 1px solid #E4E2DE; background: #FBFAF9\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 64px clamp(16px, 4vw, 40px)\">\n<h2 id=\"purpose-h\" style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.1; letter-spacing: -0.015em; max-width: 820px\">One subject, different purposes, kept apart<\/h2>\n<p style=\"margin: 16px 0 0; font-size: 17px; line-height: 1.6; max-width: 720px; color: #4A4A50\">A specialist facility can be described for its science and, separately, for what it offers clients. Each version has its own source, owner, review date and approval. Illustrated with LITE, which has not yet been drafted.<\/p>\n<div style=\"margin-top: 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 20px\">\n<div style=\"background: #FFFFFF; border: 1.5px dashed #6B6B72; padding: 24px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px\">\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">purpose · research_operational<\/p>\n<span style=\"display: inline-flex; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #FFF3D6; color: #6B4300; border: 1px dashed #B07A12\">Illustrative<\/span>\n<\/div>\n<h3 style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 24px\">Research and operational<\/h3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.55\">How the facility contributes to LSTM's scientific capabilities.<\/p>\n<dl style=\"margin: 0; display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 8px 12px; font-size: 14px\">\n<dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">source<\/dt><dd style=\"margin: 0\">[Facility page on lstmed.ac.uk]<\/dd>\n<dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">owner<\/dt><dd style=\"margin: 0\">External Relations<\/dd>\n<dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">review<\/dt><dd style=\"margin: 0\">[Date set on approval]<\/dd>\n<dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">status<\/dt><dd style=\"margin: 0\">Draft<\/dd>\n<\/dl>\n<\/div>\n<div style=\"background: #FFFFFF; border: 1.5px dashed #6B6B72; padding: 24px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px\">\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">purpose · business_commercial<\/p>\n<span style=\"display: inline-flex; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #FFF3D6; color: #6B4300; border: 1px dashed #B07A12\">Illustrative<\/span>\n<\/div>\n<h3 style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 24px\">Business and commercial<\/h3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.55\">The services, partnerships or commercial opportunities it offers, where a source documents them.<\/p>\n<dl style=\"margin: 0; display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 8px 12px; font-size: 14px\">\n<dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">source<\/dt><dd style=\"margin: 0\">[Document setting out the commercial offer]<\/dd>\n<dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">owner<\/dt><dd style=\"margin: 0\">[Facility owner, to be agreed]<\/dd>\n<dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">review<\/dt><dd style=\"margin: 0\">[Date set on approval]<\/dd>\n<dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">status<\/dt><dd style=\"margin: 0\">Draft<\/dd>\n<\/dl>\n<p style=\"margin: 0; padding-top: 12px; border-top: 1px solid #E4E2DE; font-size: 13px; line-height: 1.5; color: #4A4A50\">Allowed only when the facility's record shows a documented commercial offer.<\/p>\n<\/div>\n<\/div>\n<p style=\"margin: 24px 0 0; font-size: 15px; line-height: 1.6; max-width: 860px; color: #4A4A50\"><b style=\"color: #1B1B1F\">Other purposes kept separate in the same way:<\/b> clinical service wording is never mixed with scientific work, and volunteer recruitment for a human challenge facility is never mixed with research or partnership wording.<\/p>\n<\/div>\n<\/section>\n\n<section aria-labelledby=\"ver-h\" style=\"border-top: 1px solid #E4E2DE\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 64px clamp(16px, 4vw, 40px)\">\n<h2 id=\"ver-h\" style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.1; letter-spacing: -0.015em; max-width: 820px\">Updating wording does not automatically replace approved wording<\/h2>\n<p style=\"margin: 16px 0 0; font-size: 17px; line-height: 1.6; max-width: 720px; color: #4A4A50\">Try it: draft a revision, then approve it.<\/p>\n\n<div style=\"margin-top: 32px; display: flex; flex-wrap: wrap; gap: 8px\">\n<button type=\"button\" onClick=\"{{ draft }}\" disabled=\"{{ noDraft }}\" style=\"min-height: 44px; padding: 0 18px; font-size: 15px; font-weight: 600; background: #FFFFFF; color: #1B1B1F; border: 1.5px solid #1B1B1F\">1. Draft a revision<\/button>\n<button type=\"button\" onClick=\"{{ approve }}\" disabled=\"{{ noApprove }}\" style=\"min-height: 44px; padding: 0 18px; font-size: 15px; font-weight: 600; background: #1B1B1F; color: #FFFFFF; border: 1.5px solid #1B1B1F\">2. Approve version 2<\/button>\n<button type=\"button\" onClick=\"{{ reset }}\" disabled=\"{{ noReset }}\" style=\"min-height: 44px; padding: 0 18px; font-size: 15px; font-weight: 500; background: transparent; color: #4A4A50; border: 1.5px solid transparent; text-decoration: underline\">Start again<\/button>\n<\/div>\n\n<div style=\"margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 20px\">\n<div class=\"opt\" style=\"padding: 24px; display: flex; flex-direction: column; gap: 12px; background: {{ v1.bg }}; border: 1.5px {{ v1.border }} {{ v1.bd }}\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px\">\n<p style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 24px; color: {{ v1.fg }}\">Version 1<\/p>\n<span class=\"opt\" style=\"display: inline-flex; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: {{ v1.chipBg }}; color: {{ v1.chipFg }}; border: 1px {{ v1.border }} {{ v1.bd }}\">{{ v1.status }}<\/span>\n<\/div>\n<div aria-hidden=\"true\" style=\"display: flex; flex-direction: column; gap: 8px\"><span style=\"display: block; height: 9px; width: 96%; background: {{ v1.bar }}\"><\/span><span style=\"display: block; height: 9px; width: 88%; background: {{ v1.bar }}\"><\/span><span style=\"display: block; height: 9px; width: 62%; background: {{ v1.bar }}\"><\/span><\/div>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: {{ v1.fg }}\">{{ v1.note }}<\/p>\n<\/div>\n<div class=\"opt\" style=\"padding: 24px; display: flex; flex-direction: column; gap: 12px; background: {{ v2.bg }}; border: 1.5px {{ v2.border }} {{ v2.bd }}; opacity: {{ v2.op }}\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px\">\n<p style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 24px; color: {{ v2.fg }}\">Version 2<\/p>\n<span class=\"opt\" style=\"display: inline-flex; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: {{ v2.chipBg }}; color: {{ v2.chipFg }}; border: 1px {{ v2.border }} {{ v2.bd }}\">{{ v2.status }}<\/span>\n<\/div>\n<div aria-hidden=\"true\" style=\"display: flex; flex-direction: column; gap: 8px\"><span style=\"display: block; height: 9px; width: 92%; background: {{ v2.bar }}\"><\
