ext-decoration: none; color: #1B1B1F\">\n<span aria-hidden=\"true\" style=\"width: 14px; height: 14px; background: #B4122D; display: block\"><\/span>\n<span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 600; letter-spacing: -0.01em\">LSTM Almanac<\/span>\n<\/a>\n<nav aria-label=\"Sections\">\n<ol style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0 2px\">\n<li><a class=\"nav\" href=\"#Main\">1 What it is<\/a><\/li>\n<li><a class=\"nav\" href=\"#Information\">2 What it holds<\/a><\/li>\n<li><a class=\"nav\" href=\"#Connections\">3 Connections<\/a><\/li>\n<li><a class=\"nav\" href=\"#Workflow\">4 Workflow<\/a><\/li>\n<li><a class=\"nav\" href=\"#Messaging\">5 Messaging<\/a><\/li>\n<li><a class=\"nav\" href=\"#Accuracy\" aria-current=\"page\">6 Accuracy<\/a><\/li>\n<li><a class=\"nav\" href=\"#Roadmap\">7 Roadmap<\/a><\/li>\n<li><a class=\"nav\" href=\"#Briefing-demo\">Future use<\/a><\/li>\n<\/ol>\n<\/nav>\n<\/div>\n<\/header>\n\n<main>\n<section style=\"max-width: 1200px; margin: 0 auto; padding: clamp(48px, 7vw, 88px) clamp(16px, 4vw, 40px) 32px\">\n<p style=\"margin: 0 0 20px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #B4122D\">Section 6 of 7 · How the Almanac stays accurate<\/p>\n<h1 tabindex=\"-1\" style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(40px, 5.6vw, 68px); line-height: 1.02; letter-spacing: -0.02em; max-width: 900px\">When a figure changes, everything that depends on it knows<\/h1>\n<p style=\"margin: 24px 0 0; font-size: 18px; line-height: 1.6; max-width: 720px; color: #4A4A50; text-wrap: pretty\">Follow an annual institutional statistic through its update. The figures and names below are illustrative.<\/p>\n<\/section>\n\n<section aria-labelledby=\"anat-h\" style=\"max-width: 1200px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 40px) 48px\">\n<h2 id=\"anat-h\" style=\"margin: 0 0 16px; font-size: 13px; font-family: 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.06em; text-transform: uppercase; color: #B4122D\">What every fact carries<\/h2>\n<dl style=\"margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 1px; background: #E4E2DE; border: 1px solid #E4E2DE\">\n<div style=\"background: #FFFFFF; padding: 16px\"><dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">Exact value<\/dt><dd style=\"margin: 6px 0 0; font-size: 15px\">As published, e.g. [Figure A]<\/dd><\/div>\n<div style=\"background: #FFFFFF; padding: 16px\"><dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">Reporting period<\/dt><dd style=\"margin: 6px 0 0; font-size: 15px\">e.g. 2024/25<\/dd><\/div>\n<div style=\"background: #FFFFFF; padding: 16px\"><dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">Source<\/dt><dd style=\"margin: 6px 0 0; font-size: 15px\">e.g. the annual report<\/dd><\/div>\n<div style=\"background: #FFFFFF; padding: 16px\"><dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">Owner<\/dt><dd style=\"margin: 6px 0 0; font-size: 15px\">A team, not a person<\/dd><\/div>\n<div style=\"background: #FFFFFF; padding: 16px\"><dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">Approved wording<\/dt><dd style=\"margin: 6px 0 0; font-size: 15px\">One sentence with the value and period<\/dd><\/div>\n<div style=\"background: #FFFFFF; padding: 16px\"><dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">Review date<\/dt><dd style=\"margin: 6px 0 0; font-size: 15px\">Every 6 months for figures<\/dd><\/div>\n<\/dl>\n<\/section>\n\n<section aria-labelledby=\"sim-h\" style=\"border-top: 1px solid #E4E2DE; background: #FBFAF9\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 56px clamp(16px, 4vw, 40px)\">\n<h2 id=\"sim-h\" style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.1; letter-spacing: -0.015em\">A newer figure arrives<\/h2>\n\n<div style=\"margin-top: 28px; display: flex; flex-wrap: wrap; gap: 28px\">\n<div style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<ol style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px\">\n<sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"6\">\n<li><button class=\"opt\" type=\"button\" onClick=\"{{ s.pick }}\" aria-current=\"{{ s.cur }}\" style=\"width: 100%; min-height: 48px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; text-align: left; font-size: 15px; line-height: 1.35; border: 1.5px solid {{ s.bd }}; background: {{ s.bg }}; color: {{ s.fg }}\"><span style=\"flex: none; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; background: {{ s.dotBg }}; color: {{ s.dotFg }}\">{{ s.n }}<\/span><span>{{ s.label }}<\/span><\/button><\/li>\n<\/sc-for>\n<\/ol>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<button type=\"button\" onClick=\"{{ back }}\" disabled=\"{{ atStart }}\" style=\"min-height: 44px; padding: 0 16px; font-size: 15px; font-weight: 600; background: #FFFFFF; color: #1B1B1F; border: 1.5px solid #1B1B1F\">← Back<\/button>\n<button type=\"button\" onClick=\"{{ next }}\" disabled=\"{{ atEnd }}\" style=\"min-height: 44px; padding: 0 16px; font-size: 15px; font-weight: 600; background: #1B1B1F; color: #FFFFFF; border: 1.5px solid #1B1B1F\">{{ nextLabel }}<\/button>\n<button type=\"button\" onClick=\"{{ reset }}\" disabled=\"{{ atStart }}\" style=\"min-height: 44px; padding: 0 12px; font-size: 15px; background: transparent; color: #4A4A50; border: 0; text-decoration: underline\">Start again<\/button>\n<\/div>\n<\/div>\n\n<div aria-live=\"polite\" style=\"flex: 999 1 560px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 14px; align-content: start\">\n\n<div class=\"opt\" style=\"padding: 18px; display: flex; flex-direction: column; gap: 10px; background: {{ oldF.bg }}; border: 1.5px {{ oldF.border }} {{ oldF.bd }}\">\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">Fact · 2024/25<\/p>\n<p style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 30px; line-height: 1; color: {{ oldF.fg }}\">[Figure A]<\/p>\n<span class=\"opt\" style=\"align-self: flex-start; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{ oldF.chipBg }}; color: {{ oldF.chipFg }}; border: 1px {{ oldF.border }} {{ oldF.bd }}\">{{ oldF.status }}<\/span>\n<p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #4A4A50\">{{ oldF.note }}<\/p>\n<\/div>\n\n<div class=\"opt\" style=\"padding: 18px; display: flex; flex-direction: column; gap: 10px; background: {{ newF.bg }}; border: 1.5px {{ newF.border }} {{ newF.bd }}; opacity: {{ newF.op }}\">\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">Fact · 2025/26<\/p>\n<p style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 30px; line-height: 1; color: {{ newF.fg }}\">[Figure B]<\/p>\n<span class=\"opt\" style=\"align-self: flex-start; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{ newF.chipBg }}; color: {{ newF.chipFg }}; border: 1px {{ newF.border }} {{ newF.bd }}\">{{ newF.status }}<\/span>\n<p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #4A4A50\">{{ newF.note }}<\/p>\n<\/div>\n\n<div class=\"opt\" style=\"padding: 18px; display: flex; flex-direction: column; gap: 10px; background: {{ msg.bg }}; border: 1.5px {{ msg.border }} {{ msg.bd }}\">\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">Messaging that quotes it<\/p>\n<p style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 20px; line-height: 1.2\">About LSTM · short<\/p>\n<span class=\"opt\" style=\"align-self: flex-start; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{ msg.chipBg }}; color: {{ msg.chipFg }}; border: 1px {{ msg.border }} {{ msg.bd }}\">{{ msg.status }}<\/span>\n<p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #4A4A50\">{{ msg.note }}<\/p>\n<\/div>\n\n<div class=\"opt\" style=\"padding: 18px; display: flex; flex-direction: column; gap: 10px; background: {{ task.bg }}; border: 1.5px {{ task.border }} {{ task.bd }}; opacity: {{ task.op }}\">\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">Content owner<\/p>\n<p style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 20px; line-height: 1.2\">Review task<\/p>\n<span class=\"opt\" style=\"align-self: flex-start; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{ task.chipBg }}; color: {{ task.chipFg }}; border: 1px {{ task.border }} {{ task.bd }}\">{{ task.status }}<\/span>\n<p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #4A4A50\">{{ task.note }}<\/p>\n<\/div>\n\n<\/div>\n<\/div>\n\n<div style=\"margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px 24px; padding: 18px 20px; background: #FFFFFF; border: 1px solid #E4E2DE\">\n<p style=\"margin: 0; flex: 1 1 300px; font-size: 15px; line-height: 1.55\"><span style=\"display: inline-flex; margin-right: 8px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #1B1B1F; color: #FFFFFF\">Built<\/span>Reminder scheduling, an outbox and escalation logic.<\/p>\n<p style=\"margin: 0; flex: 1 1 300px; font-size: 15px; line-height: 1.55\"><span style=\"display: inline-flex; margin-right: 8px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #FFFFFF; color: #4A4A50; border: 1px dashed #6B6B72\">Not yet operational<\/span>Automated email delivery, pending a mail-service integration and scheduled execution. No reminder emails are sent yet.<\/p>\n<\/div>\n<\/div>\n<\/section>\n\n<section aria-labelledby=\"dash-h\" style=\"border-top: 1px solid #E4E2DE\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 56px clamp(16px, 4vw, 40px) 64px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px\">\n<h2 id=\"dash-h\" style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.1; letter-spacing: -0.015em\">The approval dashboard<\/h2>\n<span style=\"display: inline-flex; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #FFF3D6; color: #6B4300; border: 1px dashed #B07A12\">Illustrative · no live counts<\/span>\n<\/div>\n<p style=\"margin: 16px 0 0; font-size: 17px; line-height: 1.6; max-width: 720px; color: #4A4A50\">Five queues that tell editors, approvers and owners what needs attention. Select one.<\/p>\n\n<div role=\"group\" aria-label=\"Dashboard queues\" style=\"margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 10px\">\n<sc-for list=\"{{ queues }}\" as=\"qq\" hint-placeholder-count=\"5\">\n<button class=\"opt\" type=\"button\" onClick=\"{{ qq.pick }}\" aria-pressed=\"{{ qq.on }}\" style=\"min-height: 96px; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 12px; text-align: left; border: 1.5px {{ qq.border }} {{ qq.bd }}; background: {{ qq.bg }}; color: {{ qq.fg }}\"><span aria-hidden=\"true\" style=\"width: 12px; height: 12px; display: block; border-radius: 999px; background: {{ qq.dot }}\"><\/span><span style=\"font-size: 16px; font-weight: 600; line-height: 1.25\">{{ qq.name }}<\/span><\/button>\n<\/sc-for>\n<\/div>\n\n<div class=\"fade\" aria-live=\"polite\" style=\"margin-top: 16px; padding: 24px; border-top: 3px solid #1B1B1F; background: #F6F5F3; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px 32px\">\n<div>\n<p style=\"margin: 0 0 6px; font-size: 13px; font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #6B6B72\">What it shows<\/p>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55\">{{ q.what }}<\/p>\n<\/div>\n<div>\n<p style=\"margin: 0 0 6px; font-size: 13px; font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #6B6B72\">Example item<\/p>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55\">{{ q.example }}<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<nav aria-label=\"Previous and next sections\" style=\"border-top: 1px solid #E4E2DE\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 32px clamp(16px, 4vw, 40px) 56px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px\">\n<a href=\"#Messaging\" style=\"display: inline-flex; flex-direction: column; gap: 4px; min-height: 44px; padding: 16px 24px; border: 1px solid #1B1B1F; color: #1B1B1F; text-decoration: none\"><span style=\"font-size: 13px; color: #6B6B72\">Previous · Section 5<\/span><span style=\"font-size: 19px; font-weight: 600\">← How messaging is managed<\/span><\/a>\n<a href=\"#Roadmap\" style=\"display: inline-flex; flex-direction: column; gap: 4px; min-height: 44px; padding: 16px 24px; background: #1B1B1F; color: #FFFFFF; text-decoration: none\"><span style=\"font-size: 13px; color: #C9C6C0\">Next · Section 7<\/span><span style=\"font-size: 19px; font-weight: 600\">The roadmap →<\/span><\/a>\n<\/div>\n<\/nav>\n<\/main>\n<\/div>"}, "Roadmap": {"title": "LSTM Almanac: the roadmap", "tpl": "<div style=\"min-height: 100%; background: #FFFFFF\">\n\n<header style=\"border-bottom: 1px solid #E4E2DE; background: #FFFFFF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 24px\">\n<a href=\"#Main\" style=\"display: flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; color: #1B1B1F\">\n<span aria-hidden=\"true\" style=\"width: 14px; height: 14px; background: #B4122D; display: block\"><\/span>\n<span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 600; letter-spacing: -0.01em\">LSTM Almanac<\/span>\n<\/a>\n<nav aria-label=\"Sections\">\n<ol style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0 2px\">\n<li><a class=\"nav\" href=\"#Main\">1 What it is<\/a><\/li>\n<li><a class=\"nav\" href=\"#Information\">2 What it holds<\/a><\/li>\n<li><a class=\"nav\" href=\"#Connections\">3 Connections<\/a><\/li>\n<li><a class=\"nav\" href=\"#Workflow\">4 Workflow<\/a><\/li>\n<li><a class=\"nav\" href=\"#Messaging\">5 Messaging<\/a><\/li>\n<li><a class=\"nav\" href=\"#Accuracy\">6 Accuracy<\/a><\/li>\n<li><a class=\"nav\" href=\"#Roadmap\" aria-current=\"page\">7 Roadmap<\/a><\/li>\n<li><a class=\"nav\" href=\"#Briefing-demo\">Future use<\/a><\/li>\n<\/ol>\n<\/nav>\n<\/div>\n<\/header>\n\n<main>\n<section style=\"max-width: 1200px; margin: 0 auto; padding: clamp(48px, 7vw, 88px) clamp(16px, 4vw, 40px) 40px\">\n<p style=\"margin: 0 0 20px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #B4122D\">Section 7 of 7 · The roadmap<\/p>\n<h1 tabindex=\"-1\" style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(40px, 5.6vw, 68px); line-height: 1.02; letter-spacing: -0.02em; max-width: 900px\">Three phases, in a deliberate order<\/h1>\n<\/section>\n\n<section aria-label=\"Phases\" style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px) 64px\">\n<ol style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 20px\">\n\n<li style=\"display: flex; flex-direction: column; gap: 0\">\n<div aria-hidden=\"true\" style=\"height: 8px; background: #1B1B1F\"><\/div>\n<div style=\"flex: 1; border: 1.5px solid #1B1B1F; border-top: 0; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; color: #6B6B72\">Phase 1<\/p>\n<h2 style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 32px; line-height: 1.05\">Build the knowledge base<\/h2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n<span style=\"display: inline-flex; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #1B1B1F; color: #FFFFFF; border: 1px solid #1B1B1F\">Foundation built<\/span>\n<span style=\"display: inline-flex; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #FBEFF1; color: #7E0C1F; border: 1px solid #B4122D\">Content in progress<\/span>\n<\/div>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.55\">Technical foundation substantially complete; content population and approval underway.<\/p>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; font-size: 15px\">\n<li style=\"display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #EFEDEA\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; background: #1B1B1F\"><\/span>Structured knowledge<\/li>\n<li style=\"display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #EFEDEA\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; background: #1B1B1F\"><\/span>Approved messaging<\/li>\n<li style=\"display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #EFEDEA\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; background: #1B1B1F\"><\/span>Facts and figures<\/li>\n<li style=\"display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #EFEDEA\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; background: #1B1B1F\"><\/span>Evidence and relationships<\/li>\n<li style=\"display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #EFEDEA\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; background: #1B1B1F\"><\/span>Content ownership<\/li>\n<li style=\"display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #EFEDEA\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; background: #1B1B1F\"><\/span>Approval workflows<\/li>\n<li style=\"display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid #EFEDEA\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; margin-top: 6px; background: #1B1B1F\"><\/span><span>Review schedules and reminder logic <span style=\"display: block; font-size: 13px; color: #4A4A50\">Email delivery pending a mail-service integration<\/span><\/span><\/li>\n<li style=\"display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #EFEDEA; color: #7E0C1F; font-weight: 600\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; background: #B4122D\"><\/span>Drafting and approving the content<\/li>\n<\/ul>\n<\/div>\n<\/li>\n\n<li style=\"display: flex; flex-direction: column; gap: 0\">\n<div aria-hidden=\"true\" style=\"height: 8px; box-sizing: border-box; border: 1.5px dashed #6B6B72\"><\/div>\n<div style=\"flex: 1; border: 1.5px dashed #6B6B72; border-top: 0; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; color: #6B6B72\">Phase 2<\/p>\n<h2 style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 32px; line-height: 1.05\">Search and discovery<\/h2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n<span style=\"display: inline-flex; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #4A4A50; border: 1px dashed #6B6B72\">Planned<\/span>\n<\/div>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.55\">Colleagues find and reuse approved knowledge for themselves.<\/p>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; font-size: 15px\">\n<li style=\"display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #EFEDEA\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; box-sizing: border-box; border: 1.5px dashed #6B6B72\"><\/span>Search approved knowledge<\/li>\n<li style=\"display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #EFEDEA\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; box-sizing: border-box; border: 1.5px dashed #6B6B72\"><\/span>Browse institutional capabilities<\/li>\n<li style=\"display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #EFEDEA\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; box-sizing: border-box; border: 1.5px dashed #6B6B72\"><\/span>Explore connected information<\/li>\n<li style=\"display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #EFEDEA\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; box-sizing: border-box; border: 1.5px dashed #6B6B72\"><\/span>Find and reuse approved wording<\/li>\n<li style=\"display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #EFEDEA\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; box-sizing: border-box; border: 1.5px dashed #6B6B72\"><\/span>Access facts with their original context and evidence<\/li>\n<\/ul>\n<\/div>\n<\/li>\n\n<li style=\"display: flex; flex-direction: column; gap: 0\">\n<div aria-hidden=\"true\" style=\"height: 8px; box-sizing: border-box; border: 1.5px dashed #6B6B72\"><\/div>\n<div style=\"flex: 1; border: 1.5px dashed #6B6B72; border-top: 0; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; color: #6B6B72\">Phase 3<\/p>\n<h2 style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 32px; line-height: 1.05\">AI-assisted outputs<\/h2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n<span style=\"display: inline-flex; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #4A4A50; border: 1px dashed #6B6B72\">Planned<\/span>\n<\/div>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.55\">Drafts assembled from approved knowledge, for a person to finish.<\/p>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; font-size: 15px\">\n<li style=\"display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #EFEDEA\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; box-sizing: border-box; border: 1.5px dashed #6B6B72\"><\/span>Meeting briefings<\/li>\n<li style=\"display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #EFEDEA\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; box-sizing: border-box; border: 1.5px dashed #6B6B72\"><\/span>Crib sheets<\/li>\n<li style=\"display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #EFEDEA\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; box-sizing: border-box; border: 1.5px dashed #6B6B72\"><\/span>Stakeholder background notes<\/li>\n<li style=\"display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #EFEDEA\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; box-sizing: border-box; border: 1.5px dashed #6B6B72\"><\/span>Audience-specific institutional summaries<\/li>\n<li style=\"display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #EFEDEA\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; box-sizing: border-box; border: 1.5px dashed #6B6B72\"><\/span>Branded PowerPoint decks<\/li>\n<\/ul>\n<div style=\"padding: 16px; background: #F6F5F3; display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; font-size: 13px; font-weight: 700\">Built-in limits<\/p>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.55\">The AI will use only the approved knowledge the requesting colleague is authorised to access, subject to sensitivity and external-use permissions. Everything it generates stays a draft for human review.<\/p>\n<a href=\"#Briefing-demo\" style=\"align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; font-weight: 600\">See a walkthrough of how it could work →<\/a>\n<\/div>\n<\/div>\n<\/li>\n<\/ol>\n<\/section>\n\n<section aria-label=\"Closing\" style=\"background: #1B1B1F; color: #FFFFFF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: clamp(64px, 9vw, 120px) clamp(16px, 4vw, 40px)\">\n<p style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(38px, 5.4vw, 72px); line-height: 1.05; letter-spacing: -0.02em; max-width: 980px\">Start with trusted knowledge. <span style=\"color: #C9C6C0\">Make it useful.<\/span> <span style=\"color: #F2A7B4\">Then introduce AI.<\/span><\/p>\n<p style=\"margin: 40px 0 0; padding-top: 24px; border-top: 1px solid #4A4A50; font-size: 18px; line-height: 1.6; max-width: 720px; color: #E4E2DE\">A carefully maintained dataset is the foundation. AI is the future interface, not the source of truth.<\/p>\n<\/div>\n<\/section>\n\n<nav aria-label=\"Previous and next sections\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 32px clamp(16px, 4vw, 40px) 56px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px\">\n<a href=\"#Accuracy\" style=\"display: inline-flex; flex-direction: column; gap: 4px; min-height: 44px; padding: 16px 24px; border: 1px solid #1B1B1F; color: #1B1B1F; text-decoration: none\"><span style=\"font-size: 13px; color: #6B6B72\">Previous · Section 6<\/span><span style=\"font-size: 19px; font-weight: 600\">← How the Almanac stays accurate<\/span><\/a>\n<a href=\"#Briefing-demo\" style=\"display: inline-flex; flex-direction: column; gap: 4px; min-height: 44px; padding: 16px 24px; background: #1B1B1F; color: #FFFFFF; text-decoration: none\"><span style=\"font-size: 13px; color: #C9C6C0\">Optional · Phase 3 concept<\/span><span style=\"font-size: 19px; font-weight: 600\">Future use: a briefing walkthrough →<\/span><\/a>\n<\/div>\n<\/nav>\n<\/main>\n<\/div>"}, "Briefing-demo": {"title": "LSTM Almanac: future briefing walkthrough", "tpl": "<div style=\"min-height: 100%; background: #FFFFFF\">\n\n<header style=\"border-bottom: 1px solid #E4E2DE; background: #FFFFFF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 24px\">\n<a href=\"#Main\" style=\"display: flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; color: #1B1B1F\">\n<span aria-hidden=\"true\" style=\"width: 14px; height: 14px; background: #B4122D; display: block\"><\/span>\n<span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 600; letter-spacing: -0.01em\">LSTM Almanac<\/span>\n<\/a>\n<nav aria-label=\"Sections\">\n<ol style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0 2px\">\n<li><a class=\"nav\" href=\"#Main\">1 What it is<\/a><\/li>\n<li><a class=\"nav\" href=\"#Information\">2 What it holds<\/a><\/li>\n<li><a class=\"nav\" href=\"#Connections\">3 Connections<\/a><\/li>\n<li><a class=\"nav\" href=\"#Workflow\">4 Workflow<\/a><\/li>\n<li><a class=\"nav\" href=\"#Messaging\">5 Messaging<\/a><\/li>\n<li><a class=\"nav\" href=\"#Accuracy\">6 Accuracy<\/a><\/li>\n<li><a class=\"nav\" href=\"#Roadmap\">7 Roadmap<\/a><\/li>\n<li><a class=\"nav\" href=\"#Briefing-demo\" aria-current=\"page\">Future use<\/a><\/li>\n<\/ol>\n<\/nav>\n<\/div>\n<\/header>\n\n<main>\n<section style=\"max-width: 1200px; margin: 0 auto; padding: clamp(48px, 7vw, 88px) clamp(16px, 4vw, 40px) 32px\">\n<p style=\"margin: 0 0 20px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #B4122D\">Future use · Phase 3 concept<\/p>\n<h1 tabindex=\"-1\" style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(40px, 5.6vw, 68px); line-height: 1.02; letter-spacing: -0.02em; max-width: 920px\">Preparing for a meeting with an industry partner<\/h1>\n<p style=\"margin: 24px 0 0; font-size: 18px; line-height: 1.6; max-width: 740px; color: #4A4A50; text-wrap: pretty\">A colleague is meeting a potential industry partner interested in infectious disease innovation. Here is how a briefing could be drafted from approved knowledge.<\/p>\n<div style=\"margin-top: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 18px; border: 1.5px dashed #6B6B72; max-width: 820px\">\n<span style=\"display: inline-flex; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #FFFFFF; color: #4A4A50; border: 1px dashed #6B6B72\">Planned<\/span>\n<p style=\"margin: 0; flex: 1 1 300px; font-size: 15px; line-height: 1.5\">Not an operational feature. The walkthrough assumes the records shown have been approved by then.<\/p>\n<\/div>\n<\/section>\n\n<section aria-label=\"Walkthrough\" style=\"max-width: 1200px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 40px) 64px\">\n<ol role=\"list\" style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 8px\">\n<sc-for list=\"{{ tabs }}\" as=\"tb\" hint-placeholder-count=\"4\">\n<li><button class=\"opt\" type=\"button\" onClick=\"{{ tb.pick }}\" aria-current=\"{{ tb.cur }}\" style=\"width: 100%; min-height: 64px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; text-align: left; border: 1.5px solid {{ tb.bd }}; background: {{ tb.bg }}; color: {{ tb.fg }}\"><span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 20px\">{{ tb.n }}<\/span><span style=\"font-size: 16px; font-weight: 600; line-height: 1.25\">{{ tb.name }}<\/span><\/button><\/li>\n<\/sc-for>\n<\/ol>\n\n<div aria-live=\"polite\" style=\"margin-top: 24px; border-top: 3px solid #1B1B1F; padding-top: 28px\">\n\n<sc-if value=\"{{ is1 }}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"fade\" style=\"display: flex; flex-wrap: wrap; gap: 28px\">\n<div style=\"flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 18px\">\n<h2 style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 34px\">Question or request<\/h2>\n<blockquote style=\"margin: 0; padding: 24px 28px; background: #F6F5F3; border: 1px solid #E4E2DE; font-family: 'Newsreader', Georgia, serif; font-size: 23px; line-height: 1.4\">“Prepare a briefing on LSTM's relevant research strengths, facilities and capabilities for a meeting with a potential industry partner interested in infectious disease innovation.”<\/blockquote>\n<\/div>\n<dl style=\"flex: 1 1 280px; min-width: 0; margin: 0; display: flex; flex-direction: column\">\n<div style=\"padding: 12px 0; border-bottom: 1px solid #E4E2DE\"><dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">Audience<\/dt><dd style=\"margin: 4px 0 0; font-size: 16px\">Industry<\/dd><\/div>\n<div style=\"padding: 12px 0; border-bottom: 1px solid #E4E2DE\"><dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">Use<\/dt><dd style=\"margin: 4px 0 0; font-size: 16px\">External meeting, so only content cleared for outside use<\/dd><\/div>\n<div style=\"padding: 12px 0; border-bottom: 1px solid #E4E2DE\"><dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">Requested by<\/dt><dd style=\"margin: 4px 0 0; font-size: 16px\">A colleague, with their own access permissions<\/dd><\/div>\n<div style=\"padding: 12px 0\"><dt style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #6B6B72\">Output<\/dt><dd style=\"margin: 4px 0 0; font-size: 16px\">A draft briefing for them to review<\/dd><\/div>\n<\/dl>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ is2 }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"fade\" style=\"display: flex; flex-direction: column; gap: 20px\">\n<h2 style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 34px\">Knowledge selection<\/h2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6; max-width: 760px; color: #4A4A50\">Records are matched on the industry audience, capability tags such as Commercialisation and enterprise, Diagnostics and Clinical trials, and the relevant research themes. Only approved records are eligible.<\/p>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 12px\">\n<div style=\"border: 1.5px solid #1B1B1F; padding: 18px; display: flex; flex-direction: column; gap: 10px\">\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #B4122D\">Research messaging<\/p>\n<ul style=\"margin: 0; padding: 0 0 0 16px; font-size: 14px; line-height: 1.6\"><li>Research and innovation (short)<\/li><li>Innovation to Impact: Therapeutics, Diagnostics, Vaccines<\/li><li>Emerging and Re-emerging Diseases<\/li><\/ul>\n<\/div>\n<div style=\"border: 1.5px solid #1B1B1F; padding: 18px; display: flex; flex-direction: column; gap: 10px\">\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #B4122D\">Facilities and capabilities<\/p>\n<ul style=\"margin: 0; padding: 0 0 0 16px; font-size: 14px; line-height: 1.6\"><li>Centre for Drugs and Diagnostics<\/li><li>Enterprise and Innovation Unit<\/li><li>Global Health Trials Unit<\/li><\/ul>\n<\/div>\n<div style=\"border: 1.5px solid #1B1B1F; padding: 18px; display: flex; flex-direction: column; gap: 10px\">\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #B4122D\">Institutional facts<\/p>\n<ul style=\"margin: 0; padding: 0 0 0 16px; font-size: 14px; line-height: 1.6\"><li>[Approved institutional headline facts]<\/li><\/ul>\n<\/div>\n<div style=\"border: 1.5px solid #1B1B1F; padding: 18px; display: flex; flex-direction: column; gap: 10px\">\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #B4122D\">Evidence of impact<\/p>\n<ul style=\"margin: 0; padding: 0 0 0 16px; font-size: 14px; line-height: 1.6\"><li>[Approved case studies, where they exist]<\/li><\/ul>\n<\/div>\n<div style=\"border: 1.5px solid #1B1B1F; padding: 18px; display: flex; flex-direction: column; gap: 10px\">\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #B4122D\">Strategic partnerships<\/p>\n<ul style=\"margin: 0; padding: 0 0 0 16px; font-size: 14px; line-height: 1.6\">< STM’ short wording, reproduced word for word]<\/p><\/div>\n<div><h3 style=\"margin: 0 0 6px; font-size: 15px\">Relevant strengths<\/h3>\n<ul style=\"margin: 0; padding: 0 0 0 18px; font-size: 15px; line-height: 1.6\"><li><b>Centre for Drugs and Diagnostics:<\/b> a multidisciplinary team working to discover, develop and deliver new therapies and diagnostics against a range of pathogens.<\/li><li><b>Global Health Trials Unit:<\/b> designs, conducts and delivers high-quality clinical trials, providing statistical, epidemiological and methodological expertise.<\/li><\/ul><\/div>\n<div><h3 style=\"margin: 0 0 6px; font-size: 15px\">Facilities and commercial capabilities<\/h3>\n<ul style=\"margin: 0; padding: 0 0 0 18px; font-size: 15px; line-height: 1.6\"><li><b>Enterprise and Innovation Unit:<\/b> managing intellectual property, building collaborations with industry, contract research and consultancy.<\/li><li style=\"color: #4A4A50\">[Approved business and commercial wording for relevant facilities]<\/li><\/ul><\/div>\n<div><h3 style=\"margin: 0 0 6px; font-size: 15px\">Verified facts<\/h3><p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #4A4A50\">[Approved facts, each with its reporting period and source]<\/p><\/div>\n<div><h3 style=\"margin: 0 0 6px; font-size: 15px\">Sources<\/h3>\n<ol style=\"margin: 0; padding: 0 0 0 18px; font-size: 14px; line-height: 1.7; overflow-wrap: anywhere\"><li><a href=\"https://lstmed.ac.uk/research/centres/centre-for-drugs-and-diagnostics/\">Centre for Drugs and Diagnostics page<\/a><\/li><li><a href=\"https://lstmed.ac.uk/research/centres/global-health-trials-unit/\">Global Health Trials Unit page<\/a><\/li><li><a href=\"https://lstmed.ac.uk/research/centres/enterprise-and-innovation-unit/\">Enterprise and Innovation Unit page<\/a><\/li><\/ol><\/div>\n<div style=\"padding: 16px 18px; background: #F6F5F3\"><h3 style=\"margin: 0 0 6px; font-size: 15px\">Open information gaps<\/h3>\n<ul style=\"margin: 0; padding: 0 0 0 18px; font-size: 14px; line-height: 1.6\"><li>No approved figure for products brought to market. A candidate on the Centre for Drugs and Diagnostics page awaits owner confirmation.<\/li><li>The robotic high-containment laboratory cannot be described until its status is confirmed.<\/li><li>No approved case study on infectious disease innovation yet.<\/li><\/ul><\/div>\n<p style=\"margin: 0; font-size: 12px; line-height: 1.5; color: #6B6B72\">Unit descriptions are draft text from the benchmark pack, used here to illustrate. In Phase 3 only approved wording would be used.<\/p>\n<\/div>\n<\/article>\n<aside aria-label=\"Same material as slides\" style=\"flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-size: 13px; font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #6B6B72\">Optional · the same material as a branded deck<\/p>\n<div aria-hidden=\"true\" style=\"aspect-ratio: 16 / 9; background: #1B1B1F; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px\"><span style=\"width: 18px; height: 4px; background: #B4122D; display: block\"><\/span><span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 15px; color: #FFFFFF; line-height: 1.2\">LSTM and [Partner organisation]<\/span><\/div>\n<div aria-hidden=\"true\" style=\"aspect-ratio: 16 / 9; background: #FFFFFF; border: 1px solid #D6D3CD; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px\"><span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 14px; line-height: 1.2\">Strengths in infectious disease innovation<\/span><span style=\"height: 5px; width: 90%; background: #E4E2DE; display: block\"><\/span><span style=\"height: 5px; width: 76%; background: #E4E2DE; display: block\"><\/span><span style=\"height: 5px; width: 82%; background: #E4E2DE; display: block\"><\/span><\/div>\n<div aria-hidden=\"true\" style=\"aspect-ratio: 16 / 9; background: #FFFFFF; border: 1px solid #D6D3CD; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px\"><span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 14px; line-height: 1.2\">Facilities and ways to work together<\/span><span style=\"display: flex; gap: 6px\"><span style=\"flex: 1; height: 34px; background: #F6F5F3; display: block\"><\/span><span style=\"flex: 1; height: 34px; background: #F6F5F3; display: block\"><\/span><span style=\"flex: 1; height: 34px; background: #FBEFF1; display: block\"><\/span><\/span><\/div>\n<p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #4A4A50\">Slide content would come from the same approved records and carry the same draft status.<\/p>\n<\/aside>\n<\/div>\n<\/sc-if>\n\n<div style=\"margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px\">\n<button type=\"button\" onClick=\"{{ back }}\" disabled=\"{{ atStart }}\" style=\"min-height: 44px; padding: 0 16px; font-size: 15px; font-weight: 600; background: #FFFFFF; color: #1B1B1F; border: 1.5px solid #1B1B1F\">← Back<\/button>\n<button type=\"button\" onClick=\"{{ next }}\" disabled=\"{{ atEnd }}\" style=\"min-height: 44px; padding: 0 16px; font-size: 15px; font-weight: 600; background: #1B1B1F; color: #FFFFFF; border: 1.5px solid #1B1B1F\">Next step →<\/button>\n<\/div>\n<\/div>\n<\/section>\n\n<section aria-label=\"Closing\" style=\"border-top: 1px solid #E4E2DE; background: #FBFAF9\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 56px clamp(16px, 4vw, 40px)\">\n<p style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(26px, 3vw, 36px); line-height: 1.2; max-width: 860px\">A carefully maintained dataset is the foundation. AI is the future interface, not the source of truth.<\/p>\n<\/div>\n<\/section>\n\n<nav aria-label=\"Previous section and start\" style=\"border-top: 1px solid #E4E2DE\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 32px clamp(16px, 4v <script>
